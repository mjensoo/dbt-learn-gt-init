macros:
  - name: cents_to_dollars
    description: "Converts cents to dollars."
    arguments:
      - name: column_name
        description: "The name of the column containing the amount in cents."
        type: string
      - name: decimals
        description: "The number of decimal places to round the result to."
        type: integer
        #default: 2
    #returns: "Sql expression that converts the amount in cents to dollars"
    #example:
      #- description: "Convert the 'amount_cents' column to dollars with 2 decimal places."
      #  code: "{{ cents_to_dollars('amount') }}"
      #- description: "Convert the 'price_cents' column to dollars with 3 decimal places."
      #  code: "{{ cents_to_dollars('amount', 3) }}"
  - name: grant_select
    description: "Generates a SQL GRANT statement to give SELECT permissions on a set of tables, views to a specified role for a specified database."
    arguments:
      - name: schema
        description: "The name of the schema to grant SELECT permissions on."
        type: string
      - name: role
        description: "The name of the role to grant SELECT permissions to."
        type: string
      - name: database
        description: "The name of the database containing the schema."
        type: string
    #returns: "SQL statement that grants SELECT permissions on the specified schema to the specified role."
    #examples:
    #  - description: "Grant SELECT permissions on schema to 'my_role'."
    #    code: "{{ grant_select('my_schema', 'my_role', 'my_database') }}"
